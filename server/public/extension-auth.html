<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Smart Web Assistant</title>
  <link rel="stylesheet" href="/auth-assets/extension-auth.css">
  <script defer src="/auth-assets/auth-config.js"></script>
  <script defer src="/auth-assets/neon-auth.bundle.js"></script>
  <script defer src="/auth-assets/extension-auth.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand">Smart Web Assistant</div>
    <h1 id="page-title">Sign in</h1>
    <p class="intro">Use your account to continue to the browser extension.</p>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <button id="submit-button" type="submit">Sign in</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
