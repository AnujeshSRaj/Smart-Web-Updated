<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Web Assistant</title>
  <style>
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 480px;
      background-color: #f8f9fa;
    }
    #status {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 6px;
      font-weight: 500;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 10px;
      background: #ffffff;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      margin-bottom: 4px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user {
      background-color: #e8f0fe;
      color: #1a73e8;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .gemini {
      background-color: #f1f3f4;
      color: #202124;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .gemini p { margin: 0 0 8px 0; }
    .gemini p:last-child { margin-bottom: 0; }
    .gemini pre {
      background: #e0e2e4;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 11px;
      margin: 8px 0;
    }
    .gemini code {
      font-family: monospace;
      background: #e0e2e4;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .gemini ul, .gemini ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    #input-area {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }
    input:focus {
      border-color: #1a73e8;
    }
    button {
      padding: 0 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
    }
    button:disabled {
      background-color: #c2e7ff;
      color: #b3b3b3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="status">Ready</div>
  <div id="chat-container">
    <div class="message gemini">Hello! Ask me anything about this page or type a general query.</div>
  </div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Ask about this page..." autofocus />
    <button id="send-btn">Send</button>
  </div>
  <script src="marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
